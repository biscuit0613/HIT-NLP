### LoRA: rank 32, all linear layers, lr 2e-4
model_name_or_path: Qwen2-7B-Instruct
dataset_dir: data
output_dir: runs/lora_r32_all
seed: 42
cutoff_len: 1024
max_samples: 12000
per_device_train_batch_size: 4
gradient_accumulation_steps: 8
learning_rate: 2.0e-4
num_train_epochs: 1.0
lr_scheduler_type: cosine
warmup_ratio: 0.03
weight_decay: 0.0
max_grad_norm: 1.0
logging_steps: 10
save_steps: 200
save_total_limit: 2
fp16: true
gradient_checkpointing: true
lora_rank: 32
lora_alpha: 64
lora_dropout: 0.05
lora_target: all
