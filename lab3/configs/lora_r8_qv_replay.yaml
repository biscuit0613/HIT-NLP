### Stage-2 control: extra training on the same medical data, no format examples
model_name_or_path: models/Qwen2-7B-Instruct
dataset_dir: data/sft
train_file: data/sft/train_replay.json
init_adapter: runs/lora_r8_qv
output_dir: runs/lora_r8_qv_replay
seed: 44
cutoff_len: 1024
max_samples: 3000
per_device_train_batch_size: 4
gradient_accumulation_steps: 8
learning_rate: 5.0e-5
num_train_epochs: 1.0
lr_scheduler_type: cosine
warmup_ratio: 0.05
weight_decay: 0.0
max_grad_norm: 1.0
logging_steps: 5
save_steps: 100
save_total_limit: 2
fp16: true
gradient_checkpointing: true
lora_rank: 8
lora_alpha: 16
lora_dropout: 0.05
lora_target: q_proj,v_proj
use_dora: false
